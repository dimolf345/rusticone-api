services:
  mongo-test:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: rusticone-test
    volumes:
      - mongo_data_test:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test | grep 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: test
      MONGODB_URI: mongodb://mongo-test:27017/rusticone-test
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      mongo-test:
        condition: service_healthy
    command: npm run test:local

volumes:
  mongo_data_test:
