services:
  mongo-test:
    image: mongo:7
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: rusticone-test
    volumes:
      - mongo_data_test:/data/db

  redis-test:
    image: redis:7
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  tests:
    image: rusticone-api-test
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: test
      MONGO_INITDB_DATABASE: mongodb://mongo-test:27017/rusticone-test
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      REDIS_URL: redis://redis-test:6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      mongo-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    command: npm run test:local

volumes:
  mongo_data_test:
