services:
  mongo-test:
    image: mongo:7
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: rusticone-test
    volumes:
      - mongo_data_test:/data/db
    logging:
      driver: "none"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/27017' >/dev/null 2>&1"]
      interval: 1h
      start_period: 10s       # 60s is overly long; 5-10s is plenty for local/CI startup
      start_interval: 1s
      retries: 10
      timeout: 2s

  redis-test:
    image: redis:7
    ports:
      - "6380:6379"
    logging:
      driver: "none"          # Silences Redis engine and ping handshake logs
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping >/dev/null 2>&1"]
      interval: 1h            # Checked once at startup, never polled again during tests
      start_period: 5s
      start_interval: 1s
      retries: 10
      timeout: 2s

  tests:
    image: rusticone-api-test
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: test
      MONGO_INITDB_DATABASE: mongodb://mongo-test:27017/rusticone-test
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      REDIS_URL: redis://redis-test:6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      mongo-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    command: npm run test:local

volumes:
  mongo_data_test: